[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "ANN", "S", "C90"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN", "E501", "N802", "S105", "S106"]
# FastAPI の Depends()/Security() を既定値に置く形は B008 の例外
"app/routes.py" = ["B008"]
"app/auth.py" = ["B008"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["app"]

[tool.importlinter]
root_package = "app"

# ADR-006。上の層は下の層を import してよい。逆は禁止。`|` は互いに import しない兄弟
[[tool.importlinter.contracts]]
name = "ADR-006 layers"
type = "layers"
layers = [
    "app.main",
    "app.routes",
    "app.schemas",
    "app.auth | app.ratelimit | app.ai",
    "app.config",
    "app.logging",
    "app.errors",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 80

[tool.mutmut]
# 3.7.0 では paths_to_mutate/tests_dir は deprecated（mutmut --help 実行時に警告）。
# 現行キーは source_paths / pytest_add_cli_args_test_selection。
source_paths = ["app/config.py", "app/errors.py", "app/auth.py", "app/ratelimit.py"]
# mutmut は mutants/ に対象ファイルだけをコピーする。config.py は app.logging を、
# 4 ファイルとも app（パッケージ）を import するため、依存先を also_copy で補う。
also_copy = ["app/__init__.py", "app/logging.py"]
# tests/ 配下には app.main 経由でアプリ全体を組み立てるテストもあり、対象4ファイルの
# コピーだけでは import に失敗する。対象と無関係なテストを巻き込まないよう明示的に絞る。
pytest_add_cli_args_test_selection = [
    "tests/test_config.py",
    "tests/test_errors.py",
    "tests/test_auth.py",
    "tests/test_ratelimit.py",
]
