name: kotonoha_app
description: 文字盤コミュニケーション支援アプリ
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 状態管理
  flutter_riverpod: ^3.1.0

  # ルーティング
  go_router: ^17.0.1

  # ローカルストレージ
  shared_preferences: ^2.5.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5

  # HTTP通信
  dio: ^5.9.1

  # UUID
  uuid: ^4.5.1

  # TTS（音声読み上げ）
  flutter_tts: ^4.2.5

  # 緊急音再生
  audioplayers: ^6.1.0

  # 音量制御
  volume_controller: ^3.4.1

  # ロギング
  logger: ^2.5.0

  # ネットワーク状態監視
  connectivity_plus: ^7.0.0

  # 多言語化
  intl: ^0.20.1
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # 設定保存の失敗注入（テストだけ）。外部 SDK の境界でのモック（AGENTS.md 規律 5、ADR-005 検査）
  shared_preferences_platform_interface: ^2.4.1

  # E2E/統合テスト
  integration_test:
    sdk: flutter

  # テスト
  mocktail: ^1.0.4

  # ソース検査テスト用（Dartコードの構文解析）
  # 上限を広めに取る。^8.4.1 だと analyzer 9系が出た際に、周辺パッケージが
  # 追随してもここが手動bumpを要求するブロッカーになるため。
  analyzer: ">=8.4.1 <10.0.0"

  # モックサーバー（E2Eテスト用）
  http_mock_adapter: ^0.6.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/audio/
