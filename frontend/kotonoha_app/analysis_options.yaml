include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # 保存処理の await 忘れを防ぐ（ADR-005）。意図的な fire-and-forget は unawaited() で示す。
    - unawaited_futures

    # dynamic 経由の呼び出しで型検査を迂回し、誤った Hive adapter に書き込むのを防ぐ。
    - avoid_dynamic_calls

    # 購読・シンクの取りこぼしを止める。lib では network_provider が該当する。
    - cancel_subscriptions
    - close_sinks

    - prefer_const_constructors
    - prefer_const_literals_to_create_immutables
    - avoid_print
    - avoid_unnecessary_containers
    - sized_box_for_whitespace
    - use_key_in_widget_constructors
    - prefer_final_fields
    - unnecessary_this

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
  errors:
    invalid_annotation_target: ignore

    # CI の --no-fatal-infos でも違反を検出できるよう warning にする。
    unawaited_futures: warning
    avoid_dynamic_calls: warning
    cancel_subscriptions: warning
    close_sinks: warning
