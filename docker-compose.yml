version: '3.8'

services:
  postgres:
    build: ./docker/postgres
    container_name: kotonoha_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kotonoha_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-kotonoha_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - kotonoha_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kotonoha_user} -d ${POSTGRES_DB:-kotonoha_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    # 開発用 Dockerfile（--reload 有効・ボリュームマウント前提）。
    # 本番イメージはマルチステージ・非 root の backend/Dockerfile を使用する。
    build:
      context: .
      dockerfile: ./docker/backend/Dockerfile
    container_name: kotonoha_backend
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kotonoha_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-kotonoha_db}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kotonoha_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-kotonoha_db}
      TEST_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kotonoha_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/kotonoha_test
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env}
      #
      # 【アプリ設定はここに書かないこと】
      # backend/.env は ./backend:/app のマウント経由でコンテナ内の /app/.env となり、
      # pydantic-settings（config.py の env_file=".env"）が読み込む。
      # 一方 compose の environment は「OS環境変数」として渡るため .env より優先される。
      # ここに AI キーやレート制限値を書くと、backend/.env に設定していても
      # compose 側のデフォルト（空文字を含む）が勝ち、静かに上書きされる。
      # 例: ANTHROPIC_API_KEY を書くと、未設定時に空文字が注入されAI変換が壊れる。
      #
      # そのため、ここに置くのはコンテナ間接続に必要な infra 層の値だけに限定する。
      # アプリ設定（AI/レート制限/CORS/ログ/API_KEYS等）は backend/.env で管理すること。
      #
      # SECRET_KEY は `:?` で必須化しているため空文字上書きは起こらない。
      # `${VAR:-}` 形式で書くと未設定時に空文字が注入され、backend/.env の値を
      # 打ち消してしまうので使わないこと。
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kotonoha_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  kotonoha_network:
    driver: bridge
