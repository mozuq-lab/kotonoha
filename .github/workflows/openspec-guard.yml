# `openspec/changes/` 配下に追跡ファイルを置かせない。
#
# 恒久成果物は置かない（ADR-010: OpenSpec は使い捨て）。
# OpenSpec の archive はツール上「`changes/archive/` への保存」であって削除ではないため、
# ここで追跡を禁止して初めて「捨てる」が実行可能になる。曖昧にすると、Tsumiki が生んだ
# 299ファイルの工程記録が名前を変えて再生産される。
#
# **これは負債ゲート（ADR-008 で却下・削除済み）とは無関係の検査である。**
# git の出力をそのまま使うだけで、独自の枠組みもパーサも持たない。
name: OpenSpec Guard

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  openspec-changes:
    name: openspec/changes に追跡ファイルが無いこと
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check openspec/changes is untracked
        run: |
          set -euo pipefail
          tracked=$(git ls-files -- openspec/changes)
          if [ -n "$tracked" ]; then
            echo "$tracked" | while read -r f; do
              echo "::error file=${f}::openspec/changes/ 配下は追跡しない。恒久成果物は置かない（ADR-010: OpenSpec は使い捨て）"
            done
            exit 1
          fi
          echo "✅ openspec/changes/ に追跡ファイルは無い"
