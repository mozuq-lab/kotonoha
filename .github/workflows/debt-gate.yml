# 負債ゲート — 「決定が要る場面」を検出して ADR の引用を要求する。
#
# フックが主、これは二重の網である（是正計画 §5 Phase 1）。フックは編集のたびに
# 発火して書いた本人にその場で返す。CI はフックを持たない経路（別ツール・手作業・
# Web UI からの編集）を拾う。
#
# **paths フィルタを付けないこと。** 既存の flutter.yml / python.yml は
# `paths: backend/**` 等で絞っているため、差分の外を見られない。
# 層2（機械）は差分の外を見る唯一の層なので、ここで絞ると役目を失う。
name: Debt Gate

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    name: ゲート自身の検査（陽性・陰性 fixture）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      # 「ゲートが存在すること」と「ゲートが機能すること」は別である。
      # 8周の教訓（対処済みと証明したが生きていた漏えい）と同じ形の失敗を、
      # ゲート自身で繰り返さないための検査。
      - name: Run gate self-test
        run: python3 -m scripts.debt_gate.cli selftest

  openspec-changes:
    name: openspec/changes に追跡ファイルが無いこと
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # 恒久成果物は openspec/specs/ のみ（是正計画 §5「OpenSpec を使う条件」条件1）。
      # archive はツール上「changes/archive/ への保存」であって削除ではないため、
      # ここで追跡を禁止して初めて「捨てる」が実行可能になる。
      - name: Check openspec/changes is untracked
        run: python3 -m scripts.debt_gate.cli openspec-check

  debt-gate:
    name: 負債ゲート（7項目）
    runs-on: ubuntu-latest
    needs: selftest
    steps:
      - uses: actions/checkout@v6
        with:
          # base...head を取るため履歴が要る
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Resolve diff range
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "base=$PR_BASE_SHA" >> "$GITHUB_OUTPUT"
            echo "head=$PR_HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            # push の初回や force-push では before が全0になる。その場合は
            # 直前のコミットを base にする（検査対象を空にして素通しさせない）。
            if [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
              echo "base=$(git rev-parse "${PUSH_AFTER}^" 2>/dev/null || echo "$PUSH_AFTER")" >> "$GITHUB_OUTPUT"
            else
              echo "base=$PUSH_BEFORE" >> "$GITHUB_OUTPUT"
            fi
            echo "head=$PUSH_AFTER" >> "$GITHUB_OUTPUT"
          fi

      # PR 本文の ADR 引用も認める。ファイル内コメントでの引用と同じ扱い。
      # 環境変数経由で渡す（本文を直接シェルに展開しない）。
      - name: Write PR body to a file
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "${PR_BODY:-}" > /tmp/pr-body.txt

      - name: Run debt gate
        run: |
          python3 -m scripts.debt_gate.cli ci \
            --base "${{ steps.range.outputs.base }}" \
            --head "${{ steps.range.outputs.head }}" \
            --pr-body-file /tmp/pr-body.txt
