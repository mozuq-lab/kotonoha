# 負債ゲート — 「決定が要る場面」を検出して ADR の引用を要求する。設計は ADR-008。
#
# ブロックするのは「書き換えに閉じている」検査だけである。正規のパーサで
# いまの状態を読み、集合にして、コミット済みの許可リスト（.debt-gate/allowlist.json）
# と比べる。**git を使わない**——初回実装（revert 済み）が抱えた基準ずれ
# （merge-base 対 base 先端）・force-push・shallow clone・git 失敗の fail-open は、
# 「前の状態」を取らないので構造的に発生しない。
#
# **paths フィルタを付けないこと。** 既存の flutter.yml / python.yml は
# `paths: backend/**` 等で絞っているため差分の外を見られない。
# 層2（機械）は差分の外を見る唯一の層なので、ここで絞ると役目を失う。
#
# `PostToolUse` フックは置かない（ADR-008）。ブロックしないフックは、
# 編集のたびに読まれない出力を積むだけになる。
name: Debt Gate

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    name: ゲート自身の検査
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install parsers
        run: pip install "pyyaml==6.0.3" "packaging>=24,<27"

      # 「ゲートが存在すること」と「ゲートが機能すること」は別である。
      # ここが緑であることが後者の証拠になる。書き方を変えても同じ集合が出ること
      # （4スペース indent・タグ改行・属性改行・extras・環境マーカー）と、
      # 取得失敗を緑にしないことを固定している。
      - name: Run gate self-test
        run: python3 -m scripts.debt_gate.cli selftest

  openspec-changes:
    name: openspec/changes に追跡ファイルが無いこと
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # 恒久成果物は openspec/specs/ のみ（是正計画 §5「OpenSpec を使う条件」条件1）。
      # archive はツール上「changes/archive/ への保存」であって削除ではないため、
      # ここで追跡を禁止して初めて「捨てる」が実行可能になる。
      - name: Check openspec/changes is untracked
        run: |
          set -euo pipefail
          tracked=$(git ls-files -- openspec/changes)
          if [ -n "$tracked" ]; then
            echo "$tracked" | while read -r f; do
              echo "::error file=${f}::openspec/changes/ 配下は追跡しない。恒久成果物は openspec/specs/ のみ"
            done
            echo "change は工程記録である。299ファイルを名前を変えて再生産しないため、CI で禁止する。"
            exit 1
          fi
          echo "✅ openspec/changes/ に追跡ファイルは無い"

  debt-gate:
    name: 負債ゲート（状態 vs 許可リスト）
    runs-on: ubuntu-latest
    needs: selftest
    steps:
      # 差分ではなく「いまの状態」を見るので、履歴は要らない（fetch-depth 既定でよい）
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install parsers
        run: pip install "pyyaml==6.0.3" "packaging>=24,<27"

      - name: Run debt gate
        run: python3 -m scripts.debt_gate.cli check
