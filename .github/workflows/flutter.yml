name: Flutter CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/flutter.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/flutter.yml'

env:
  FLUTTER_VERSION: '3.38.1'
  JAVA_VERSION: '17'
  API_BASE_URL: ${{ vars.API_BASE_URL || 'http://localhost:8000' }}
  AI_API_KEY: ${{ secrets.AI_API_KEY || '' }}

jobs:
  analyze:
    name: Analyze & Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/kotonoha_app

    steps:
      - uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run code generation
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    needs: analyze

    defaults:
      run:
        working-directory: frontend/kotonoha_app

    steps:
      - uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run code generation
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Check coverage threshold
        run: |
          # Check if coverage file exists
          if [ ! -f coverage/lcov.info ]; then
            echo "::warning::Coverage file not found"
            exit 0
          fi

          # Calculate coverage using simple line counting
          TOTAL_LINES=$(grep -c "^DA:" coverage/lcov.info || echo "0")
          COVERED_LINES=$(grep "^DA:" coverage/lcov.info | grep -v ",0$" | wc -l || echo "0")

          if [ "$TOTAL_LINES" -gt 0 ]; then
            COVERAGE=$(echo "scale=1; $COVERED_LINES * 100 / $TOTAL_LINES" | bc)
            echo "Coverage: $COVERAGE% ($COVERED_LINES/$TOTAL_LINES lines)"

            THRESHOLD=80
            if [ "$(echo "$COVERAGE < $THRESHOLD" | bc)" = "1" ]; then
              echo "::warning::Coverage $COVERAGE% is below threshold $THRESHOLD%"
            else
              echo "✅ Coverage $COVERAGE% meets threshold $THRESHOLD%"
            fi
          else
            echo "::warning::No coverage data found"
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info
          flags: flutter
          name: flutter-coverage
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        with:
          name: flutter-coverage-report
          path: coverage/
          retention-days: 7

  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: test

    defaults:
      run:
        working-directory: frontend/kotonoha_app

    steps:
      - uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run code generation
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Setup ChromeDriver
        uses: nanasess/setup-chromedriver@v2

      - name: Start ChromeDriver
        run: |
          set -euo pipefail
          # nohup でステップのシェル終了後もプロセスを残す。
          # `chromedriver &` だけではステップ終了時に道連れになり得る。
          # ポート4444は `flutter drive --driver-port` の既定値と一致させている。
          nohup chromedriver --port=4444 > /tmp/chromedriver.log 2>&1 &
          # listen 開始前に flutter drive が接続しに行く race を防ぐ。
          # nc はrunnerに存在しない可能性があるため、chromedriver自身の
          # /status エンドポイントを叩いて「起動済み かつ 応答可能」を確認する。
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:4444/status > /dev/null; then
              echo "ChromeDriver is ready on port 4444"
              exit 0
            fi
            sleep 1
          done
          echo "::error::ChromeDriver did not become ready on port 4444 within 30s"
          cat /tmp/chromedriver.log || true
          exit 1

      - name: Run integration tests (headless web)
        run: |
          set -euo pipefail
          flutter config --enable-web

          # NOTE: `flutter test integration_test/ -d chrome` は web では未サポート。
          # web では flutter drive + chromedriver 経由で1ターゲットずつ実行する。
          # 失敗はジョブ失敗として扱う（`|| echo` による握り潰しは禁止）。
          #
          # 【CI対象外】以下は CI では実行しない。無言スキップにならないよう
          # 除外理由と件数をログに出す。
          # - ai_conversion_e2e_test.dart: AI変換APIとAPIキーが必要
          # - performance_profiling_e2e_test.dart: 実性能測定でCIでは不安定
          # - integration_test/device_test/: 実機前提（そもそもglob対象外）
          EXCLUDED="ai_conversion_e2e_test.dart performance_profiling_e2e_test.dart"

          targets=()
          for target in integration_test/*_test.dart; do
            base=$(basename "$target")
            skip=""
            for excluded in $EXCLUDED; do
              if [ "$base" = "$excluded" ]; then skip="yes"; fi
            done
            if [ -n "$skip" ]; then
              echo "::notice::skipped (CI対象外): $target"
            else
              targets+=("$target")
            fi
          done
          echo "Running ${#targets[@]} integration test target(s); skipped $(echo $EXCLUDED | wc -w | tr -d ' ')"

          for target in "${targets[@]}"; do
            echo "::group::$target"
            # 失敗時も endgroup を出してログの折りたたみが残らないようにする
            if ! flutter drive \
              --driver=test_driver/integration_test.dart \
              --target="$target" \
              -d web-server \
              --browser-name=chrome \
              --headless; then
              echo "::endgroup::"
              echo "::error::Integration test failed: $target"
              exit 1
            fi
            echo "::endgroup::"
          done

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: test

    defaults:
      run:
        working-directory: frontend/kotonoha_app

    steps:
      - uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run code generation
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build Web (Release)
        run: >
          flutter build web --release
          --dart-define=API_BASE_URL="${API_BASE_URL}"
          --dart-define=AI_API_KEY="${AI_API_KEY}"

      - name: Upload Web build
        uses: actions/upload-artifact@v6
        with:
          name: web-build
          path: frontend/kotonoha_app/build/web
          retention-days: 30

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: test

    defaults:
      run:
        working-directory: frontend/kotonoha_app

    steps:
      - uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run code generation
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build APK (Release)
        run: >
          flutter build apk --release --flavor internal
          --dart-define=API_BASE_URL="${API_BASE_URL}"
          --dart-define=AI_API_KEY="${AI_API_KEY}"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: android-apk
          path: frontend/kotonoha_app/build/app/outputs/flutter-apk/app-internal-release.apk
          retention-days: 30

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    defaults:
      run:
        working-directory: frontend/kotonoha_app

    steps:
      - uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run code generation
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build iOS (no codesign)
        run: >
          flutter build ios --release --no-codesign
          --dart-define=API_BASE_URL="${API_BASE_URL}"
          --dart-define=AI_API_KEY="${AI_API_KEY}"

      - name: Upload iOS build
        uses: actions/upload-artifact@v6
        with:
          name: ios-build
          path: frontend/kotonoha_app/build/ios/iphoneos/
          retention-days: 30

  deploy-web:
    name: Deploy Web to Vercel
    runs-on: ubuntu-latest
    # NOTE: integration-test は現状CIでの実績がないため、まだデプロイの前提条件に
    # しない（塞いでしまうため）。数回グリーンを確認できたら needs に追加すること。
    needs: [build-web]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - uses: actions/checkout@v6

      - name: Download Web build
        uses: actions/download-artifact@v7
        with:
          name: web-build
          path: ./web-build

      - name: Deploy to Vercel
        id: deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./web-build
          vercel-args: '--prod'
        continue-on-error: true

      - name: Deployment status
        run: |
          if [ "${{ steps.deploy.outcome }}" == "success" ]; then
            echo "✅ Deployed to: ${{ steps.deploy.outputs.url }}"
          else
            echo "⚠️ Deployment skipped or failed. Ensure Vercel secrets are configured."
          fi
