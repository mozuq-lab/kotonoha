name: Flutter CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/flutter.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/flutter.yml'

env:
  FLUTTER_VERSION: '3.38.1'
  JAVA_VERSION: '17'
  API_BASE_URL: ${{ vars.API_BASE_URL || 'http://localhost:8000' }}
  AI_API_KEY: ${{ secrets.AI_API_KEY || '' }}

jobs:
  analyze:
    name: Analyze & Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/kotonoha_app

    steps:
      - uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run code generation
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    needs: analyze

    defaults:
      run:
        working-directory: frontend/kotonoha_app

    steps:
      - uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run code generation
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Check coverage threshold
        run: |
          set -euo pipefail

          # Check if coverage file exists
          if [ ! -f coverage/lcov.info ]; then
            echo "::error::Coverage file not found"
            exit 1
          fi

          # Calculate coverage using simple line counting
          #
          # 【既知の制約】: `flutter test --coverage` は「どのテストからも import されない
          # lib/ 配下のファイル」を lcov.info に出力しない。そのため母数(DA行)が過小になり、
          # ここで算出される値は実際のカバレッジより高く出る（過大評価）。
          # 厳密なゲートにするには全 lib/ ファイルを import する coverage helper テストの
          # 追加、または very_good_cli 等の導入が必要。現状は下限チェックとしてのみ機能する。
          # NOTE: `|| echo "0"` だと0件マッチ時に "0\n0" となり数値比較が壊れるため `|| true` を使う。
          # `set -u` 下でも空文字にならないよう ${VAR:-0} で受ける。
          TOTAL_LINES=$(grep -c "^DA:" coverage/lcov.info || true)
          TOTAL_LINES=${TOTAL_LINES:-0}
          COVERED_LINES=$(grep "^DA:" coverage/lcov.info | grep -vc ",0$" || true)
          COVERED_LINES=${COVERED_LINES:-0}

          if [ "$TOTAL_LINES" -gt 0 ]; then
            COVERAGE=$(echo "scale=1; $COVERED_LINES * 100 / $TOTAL_LINES" | bc)
            echo "Coverage: $COVERAGE% ($COVERED_LINES/$TOTAL_LINES lines)"

            THRESHOLD=80
            if [ "$(echo "$COVERAGE < $THRESHOLD" | bc)" = "1" ]; then
              echo "::error::Coverage $COVERAGE% is below threshold $THRESHOLD%"
              exit 1
            fi
            echo "✅ Coverage $COVERAGE% meets threshold $THRESHOLD%"
          else
            echo "::error::No coverage data found"
            exit 1
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info
          flags: flutter
          name: flutter-coverage
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        with:
          name: flutter-coverage-report
          path: coverage/
          retention-days: 7

  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: test

    defaults:
      run:
        working-directory: frontend/kotonoha_app

    steps:
      - uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run code generation
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Setup ChromeDriver
        uses: nanasess/setup-chromedriver@v2

      - name: Start ChromeDriver
        run: |
          set -euo pipefail
          # nohup でステップのシェル終了後もプロセスを残す。
          # `chromedriver &` だけではステップ終了時に道連れになり得る。
          # ポート4444は `flutter drive --driver-port` の既定値と一致させている。
          nohup chromedriver --port=4444 > /tmp/chromedriver.log 2>&1 &
          # listen 開始前に flutter drive が接続しに行く race を防ぐ。
          # nc はrunnerに存在しない可能性があるため、chromedriver自身の
          # /status エンドポイントを叩いて「起動済み かつ 応答可能」を確認する。
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:4444/status > /dev/null; then
              echo "ChromeDriver is ready on port 4444"
              exit 0
            fi
            sleep 1
          done
          echo "::error::ChromeDriver did not become ready on port 4444 within 30s"
          cat /tmp/chromedriver.log || true
          exit 1

      - name: Run integration tests (headless web)
        run: |
          set -euo pipefail
          flutter config --enable-web

          # NOTE: `flutter test integration_test/ -d chrome` は web では未サポート。
          # web では flutter drive + chromedriver 経由で1ターゲットずつ実行する。
          # 失敗はジョブ失敗として扱う（`|| echo` による握り潰しは禁止）。
          #
          # 【CI対象外】以下は CI では実行しない。無言スキップにならないよう
          # 除外理由と件数をログに出す。
          # - ai_conversion_e2e_test.dart: AI変換APIとAPIキーが必要
          # - performance_profiling_e2e_test.dart: 実性能測定でCIでは不安定
          # - integration_test/device_test/: 実機前提（そもそもglob対象外）
          EXCLUDED="ai_conversion_e2e_test.dart performance_profiling_e2e_test.dart"

          targets=()
          for target in integration_test/*_test.dart; do
            base=$(basename "$target")
            skip=""
            for excluded in $EXCLUDED; do
              if [ "$base" = "$excluded" ]; then skip="yes"; fi
            done
            if [ -n "$skip" ]; then
              echo "::notice::skipped (CI対象外): $target"
            else
              targets+=("$target")
            fi
          done
          echo "Running ${#targets[@]} integration test target(s); skipped $(echo $EXCLUDED | wc -w | tr -d ' ')"

          for target in "${targets[@]}"; do
            echo "::group::$target"
            # 失敗時も endgroup を出してログの折りたたみが残らないようにする
            if ! flutter drive \
              --driver=test_driver/integration_test.dart \
              --target="$target" \
              -d web-server \
              --browser-name=chrome \
              --headless; then
              echo "::endgroup::"
              echo "::error::Integration test failed: $target"
              exit 1
            fi
            echo "::endgroup::"
          done

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: test

    defaults:
      run:
        working-directory: frontend/kotonoha_app

    steps:
      - uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run code generation
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build Web (Release)
        run: >
          flutter build web --release
          --dart-define=API_BASE_URL="${API_BASE_URL}"
          --dart-define=AI_API_KEY="${AI_API_KEY}"

      - name: Upload Web build
        uses: actions/upload-artifact@v6
        with:
          name: web-build
          path: frontend/kotonoha_app/build/web
          retention-days: 30

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: test

    defaults:
      run:
        working-directory: frontend/kotonoha_app

    steps:
      - uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run code generation
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build APK (Release)
        run: >
          flutter build apk --release --flavor internal
          --dart-define=API_BASE_URL="${API_BASE_URL}"
          --dart-define=AI_API_KEY="${AI_API_KEY}"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: android-apk
          path: frontend/kotonoha_app/build/app/outputs/flutter-apk/app-internal-release.apk
          retention-days: 30

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    defaults:
      run:
        working-directory: frontend/kotonoha_app

    steps:
      - uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run code generation
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build iOS (no codesign)
        run: >
          flutter build ios --release --no-codesign
          --dart-define=API_BASE_URL="${API_BASE_URL}"
          --dart-define=AI_API_KEY="${AI_API_KEY}"

      - name: Upload iOS build
        uses: actions/upload-artifact@v6
        with:
          name: ios-build
          path: frontend/kotonoha_app/build/ios/iphoneos/
          retention-days: 30

  deploy-web:
    name: Deploy Web to Vercel
    runs-on: ubuntu-latest
    # NOTE: integration-test は現状CIでの実績がないため、まだデプロイの前提条件に
    # しない（塞いでしまうため）。数回グリーンを確認できたら needs に追加すること。
    needs: [build-web]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.preview-url }}

    steps:
      - uses: actions/checkout@v6

      - name: Download Web build
        uses: actions/download-artifact@v7
        with:
          name: web-build
          path: ./web-build

      - name: Add Vercel config to build output
        run: |
          set -euo pipefail
          # vercel.json はリポジトリ側にあり、成果物(build/web)には含まれないため、
          # デプロイ対象ディレクトリへコピーする。これが無いと SPA rewrites と
          # セキュリティヘッダーが本番で失われる。
          # デプロイ対象は build/web の中身そのものなので outputDirectory は "." に上書きする。
          python3 - <<'EOF'
          import json
          cfg = json.load(open('frontend/kotonoha_app/vercel.json'))
          cfg['outputDirectory'] = '.'
          json.dump(cfg, open('./web-build/vercel.json', 'w'), indent=2, ensure_ascii=False)
          EOF
          test -f ./web-build/vercel.json

      - name: Check Vercel secrets
        id: vercel_check
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          # secrets コンテキストは job-level `if:` で参照できないため、
          # env 経由でステップ出力に落として後続ステップを条件分岐させる。
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Vercel secrets が未設定のためデプロイをスキップします（VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID）"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      # secrets 設定済みのときのみ実行し、その場合の失敗はジョブ失敗として扱う
      # （continue-on-error は付けない）。握り潰すと vercel.json のコピー漏れ等に
      # 気付けないため。未設定環境では上の Check ステップでスキップされる。
      - name: Deploy to Vercel
        id: deploy
        if: steps.vercel_check.outputs.configured == 'true'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./web-build
          vercel-args: '--prod'

      - name: Deployment status
        if: steps.vercel_check.outputs.configured == 'true'
        run: |
          echo "✅ Deployed to: ${{ steps.deploy.outputs.preview-url }}"
