name: Worker CI

on:
  push:
    branches: [main, develop]
    paths: ['backend/worker/**', '.github/workflows/worker.yml']
  pull_request:
    branches: [main, develop]
    paths: ['backend/worker/**', '.github/workflows/worker.yml']

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend/worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx wrangler deploy --dry-run --outdir /tmp/kotonoha-worker-build
