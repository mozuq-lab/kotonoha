name: Release

on:
  push:
    tags:
      - 'v*'

env:
  FLUTTER_VERSION: '3.38.1'
  JAVA_VERSION: '17'
  API_BASE_URL: ${{ vars.API_BASE_URL || 'http://localhost:8000' }}

jobs:
  validate-tag:
    name: Validate Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Get version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

  build-android:
    name: Build Android Release
    runs-on: ubuntu-latest
    needs: validate-tag
    env:
      AI_API_KEY: ${{ secrets.AI_API_KEY || '' }}
      # 秘密そのものは使う step にだけ渡す。有無だけをここに置き、step の if で見る
      HAS_ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    defaults:
      run:
        working-directory: frontend/kotonoha_app

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # For signed release, decode keystore from secrets
      # 鍵と key.properties は workspace に置かず、ランナーの一時ディレクトリへ（L-94）。
      # job の env では runner コンテキストが使えないので、ここで GITHUB_ENV に書く
      - name: Locate signing files
        run: echo "KOTONOHA_KEY_PROPERTIES=$RUNNER_TEMP/key.properties" >> "$GITHUB_ENV"

      - name: Decode Keystore
        if: env.HAS_ANDROID_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"

      - name: Create key.properties
        if: env.HAS_ANDROID_KEYSTORE == 'true'
        env:
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cat > "$KOTONOHA_KEY_PROPERTIES" << EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$RUNNER_TEMP/upload-keystore.jks
          EOF

      - name: Build APK (Release)
        run: >
          flutter build apk --release --flavor production
          --dart-define=API_BASE_URL="${API_BASE_URL}"
          --dart-define=AI_API_KEY="${AI_API_KEY}"

      - name: Build App Bundle (Release)
        run: >
          flutter build appbundle --release --flavor production
          --dart-define=API_BASE_URL="${API_BASE_URL}"
          --dart-define=AI_API_KEY="${AI_API_KEY}"

      # flavor（production / internal）を定義しているため、出力先は flutter-apk/app-production-release.apk と
      # bundle/productionRelease/app-production-release.aab になる。flavor 無しの build は Gradle は通るが
      # Flutter ツールが bundle/release/ を探して失敗する（2026-09-05 実測）。
      # AAB には R8 の mapping（BUNDLE-METADATA/com.android.tools.build.obfuscation/proguard.map）と
      # libflutter のネイティブシンボルが同梱され、Play Console がそのまま読む（台帳 #85 L-52）。
      - name: Rename artifacts
        run: |
          mv build/app/outputs/flutter-apk/app-production-release.apk build/app/outputs/flutter-apk/kotonoha-${{ needs.validate-tag.outputs.version }}.apk
          mv build/app/outputs/bundle/productionRelease/app-production-release.aab build/app/outputs/bundle/productionRelease/kotonoha-${{ needs.validate-tag.outputs.version }}.aab

      - name: Upload APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: android-apk-release
          path: frontend/kotonoha_app/build/app/outputs/flutter-apk/kotonoha-${{ needs.validate-tag.outputs.version }}.apk
          retention-days: 90

      - name: Upload App Bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: android-aab-release
          path: frontend/kotonoha_app/build/app/outputs/bundle/productionRelease/kotonoha-${{ needs.validate-tag.outputs.version }}.aab
          retention-days: 90

      # 失敗・取り消しでも鍵を残さない（L-94）
      - name: Remove signing files
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks" "$KOTONOHA_KEY_PROPERTIES"

  build-ios:
    name: Build iOS Release
    runs-on: macos-latest
    needs: validate-tag
    env:
      AI_API_KEY: ${{ secrets.AI_API_KEY || '' }}
      HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_BUILD_CERTIFICATE_BASE64 != '' }}

    defaults:
      run:
        working-directory: frontend/kotonoha_app

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # 証明書と keychain は workspace に置かず、ランナーの一時ディレクトリへ（L-94）
      - name: Locate signing files
        run: echo "KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db" >> "$GITHUB_ENV"

      # For signed release with Apple certificates
      - name: Install Apple Certificate
        if: env.HAS_APPLE_CERTIFICATE == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          # Create keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Build iOS (no codesign for testing)
        run: >
          flutter build ios --release --no-codesign
          --dart-define=API_BASE_URL="${API_BASE_URL}"
          --dart-define=AI_API_KEY="${AI_API_KEY}"

      - name: Create IPA archive
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r ../../../kotonoha-ios-${{ needs.validate-tag.outputs.version }}.ipa Payload

      - name: Upload iOS build
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ios-release
          path: frontend/kotonoha_app/kotonoha-ios-${{ needs.validate-tag.outputs.version }}.ipa
          retention-days: 90

      # 失敗・取り消しでも証明書と keychain を残さない（L-94）
      - name: Remove signing files
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/certificate.p12"

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate-tag, build-android, build-ios]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download all artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: release-artifacts

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Release v${{ needs.validate-tag.outputs.version }}
          draft: true
          prerelease: ${{ contains(needs.validate-tag.outputs.version, 'beta') || contains(needs.validate-tag.outputs.version, 'alpha') }}
          generate_release_notes: true
          files: |
            release-artifacts/android-apk-release/*.apk
            release-artifacts/android-aab-release/*.aab
            release-artifacts/ios-release/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
