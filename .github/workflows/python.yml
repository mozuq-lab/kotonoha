name: Python CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/python.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/python.yml'

env:
  PYTHON_VERSION: '3.12'
  # 表示用。実際のゲートは backend/pyproject.toml の
  # [tool.coverage.report] fail_under が担う（pytest-cov が自動採用）。
  # 値を変える場合は pyproject.toml 側を変更し、ここは表示を合わせること。
  # 仕様 NFR-501（docs/spec/kotonoha-requirements.md）と backend/pyproject.toml の
  # fail_under とも揃えている。
  COVERAGE_THRESHOLD: 80

jobs:
  lint:
    name: Lint / Types / Layers / Gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: './backend/requirements-dev.txt'
      - run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: black --check app tests
      - run: mypy                      # ADR-003 / 004（strict、対象は pyproject の files）
      - run: lint-imports              # ADR-006
      - run: bash scripts/gates.sh     # 完了条件の grep

  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: './backend/requirements-dev.txt'
      - run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Run tests (pytest-randomly shuffles order; seed is printed in the log)
        run: pytest --cov=app --cov-report=xml --cov-report=html --cov-report=term-missing -v

      # NOTE: カバレッジ未達の判定は上の「Run tests with coverage」で完了している。
      # pytest-cov は --cov-fail-under 未指定でも pyproject.toml の
      # [tool.coverage.report] fail_under を採用するため、閾値未満なら
      # pytest 自体が非ゼロ終了する（＝閾値の単一の情報源は pyproject.toml）。
      # このステップは実測値をログに残すための表示専用。ここで二重に閾値判定を
      # 行うと、基準が2箇所に分かれて食い違う原因になる。
      - name: Report coverage
        run: |
          set -euo pipefail

          if [ ! -f coverage.xml ]; then
            echo "::error::coverage.xml が生成されていない"
            exit 1
          fi

          # Extract coverage percentage from XML report
          COVERAGE=$(python -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          root = tree.getroot()
          line_rate = float(root.get('line-rate', 0))
          print(f'{line_rate * 100:.1f}')
          " 2>/dev/null || echo "0")
          echo "Coverage: $COVERAGE%（閾値 ${{ env.COVERAGE_THRESHOLD }}% の判定は pytest 側で実施済み）"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          flags: python
          name: python-coverage
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v6
        with:
          name: python-coverage-report
          path: htmlcov
          retention-days: 7

  security:
    name: Security Audit
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run security audit
        run: pip-audit -r requirements.txt
        continue-on-error: true

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: kotonoha-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [test, build-docker]
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging

    steps:
      - uses: actions/checkout@v6

      - name: Deploy to Staging
        run: |
          echo "🚀 Staging deployment would be triggered here"
          echo "Configure AWS/GCP/Azure deployment in this step"
        # 配布先へのデプロイは未実装。現在は案内の表示のみ。

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test, build-docker]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production

    steps:
      - uses: actions/checkout@v6

      - name: Deploy to Production
        run: |
          echo "🚀 Production deployment would be triggered here"
          echo "Configure AWS/GCP/Azure deployment in this step"
        # 配布先へのデプロイは未実装。現在は案内の表示のみ。
