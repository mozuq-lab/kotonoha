name: Python CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/python.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/python.yml'

env:
  PYTHON_VERSION: '3.10'
  # 表示用。実際のゲートは backend/pyproject.toml の
  # [tool.coverage.report] fail_under が担う（pytest-cov が自動採用）。
  # 値を変える場合は pyproject.toml 側を変更し、ここは表示を合わせること。
  # CLAUDE.md / docs/tech-stack.md の「全体80%以上」とも揃えている。
  COVERAGE_THRESHOLD: 80

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: './backend/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # ruff / black のバージョンは .pre-commit-config.yaml および
          # backend/requirements.txt と揃えること。揃っていないと、
          # ローカルで整形・検査を通したファイルが CI で落ちる。
          pip install ruff==0.14.7 black==26.1.0

      - name: Run Ruff lint check
        run: ruff check app tests

      - name: Run Black format check
        run: black --check app tests

  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: './backend/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U test_user; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Run database migrations
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: test_db
          SECRET_KEY: test-secret-key-for-ci
          ENVIRONMENT: test
        run: alembic upgrade head

      - name: Run tests with coverage
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: test_db
          SECRET_KEY: test-secret-key-for-ci
          ENVIRONMENT: test
          TEST_DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_db
        run: pytest --cov=app --cov-report=xml --cov-report=html --cov-report=term-missing -v

      # NOTE: カバレッジ未達の判定は上の「Run tests with coverage」で完了している。
      # pytest-cov は --cov-fail-under 未指定でも pyproject.toml の
      # [tool.coverage.report] fail_under を採用するため、閾値未満なら
      # pytest 自体が非ゼロ終了する（＝閾値の単一の情報源は pyproject.toml）。
      # このステップは実測値をログに残すための表示専用。ここで二重に閾値判定を
      # 行うと、基準が2箇所に分かれて食い違う原因になる。
      - name: Report coverage
        run: |
          set -euo pipefail

          if [ ! -f coverage.xml ]; then
            echo "::error::coverage.xml が生成されていない"
            exit 1
          fi

          # Extract coverage percentage from XML report
          COVERAGE=$(python -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          root = tree.getroot()
          line_rate = float(root.get('line-rate', 0))
          print(f'{line_rate * 100:.1f}')
          " 2>/dev/null || echo "0")
          echo "Coverage: $COVERAGE%（閾値 ${{ env.COVERAGE_THRESHOLD }}% の判定は pytest 側で実施済み）"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          flags: python
          name: python-coverage
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v6
        with:
          name: python-coverage-report
          path: htmlcov
          retention-days: 7

  security:
    name: Security Audit
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run security audit
        run: pip-audit -r requirements.txt
        continue-on-error: true

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: kotonoha-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [test, build-docker]
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging

    steps:
      - uses: actions/checkout@v6

      - name: Deploy to Staging
        run: |
          echo "🚀 Staging deployment would be triggered here"
          echo "Configure AWS/GCP/Azure deployment in this step"
        # Add actual deployment steps here:
        # - AWS ECS: aws ecs update-service
        # - Google Cloud Run: gcloud run deploy
        # - Azure Container Apps: az containerapp update

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test, build-docker]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production

    steps:
      - uses: actions/checkout@v6

      - name: Deploy to Production
        run: |
          echo "🚀 Production deployment would be triggered here"
          echo "Configure AWS/GCP/Azure deployment in this step"
        # Add actual deployment steps here:
        # - AWS ECS: aws ecs update-service
        # - Google Cloud Run: gcloud run deploy
        # - Azure Container Apps: az containerapp update
