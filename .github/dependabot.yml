version: 2
updates:
  # Flutter/Dart dependencies
  - package-ecosystem: "pub"
    directory: "/frontend/kotonoha_app"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "flutter"
    commit-message:
      prefix: "chore(deps)"

  # 本番 Worker の npm 依存。FastAPI は開発・比較用なので対象にしない
  - package-ecosystem: "npm"
    directory: "/backend/worker"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      # wrangler は miniflare と workers-types の版を指定するので、別々に上げると解決できない
      cloudflare:
        patterns:
          - "wrangler"
          - "miniflare"
          - "@cloudflare/workers-types"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"
