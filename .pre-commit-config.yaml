repos:
  # General file quality
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^frontend/
      - id: end-of-file-fixer
        exclude: ^frontend/
      - id: check-yaml
      - id: check-json
        exclude: ^frontend/
      - id: check-added-large-files
        args: ['--maxkb=1000']

  # Python: Ruff (linter)
  # NOTE: フォーマッタは black に統一する。CI（.github/workflows/python.yml）が
  # `black --check` を回すため、ここで ruff-format を使うと両者が食い違い、
  # ローカルで整形したファイルが CI で落ちる（assert文の折り返し等で差が出る）。
  # rev は backend/requirements.txt の ruff および CI の pip install と揃えること。
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.7
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/

  # Python: Black (formatter) — CI と同一のフォーマッタを使う
  - repo: https://github.com/psf/black
    rev: 26.1.0
    hooks:
      - id: black
        files: ^backend/

  # Flutter/Dart: Analyze and Format
  - repo: local
    hooks:
      # NOTE: entry の先頭で GIT_DIR 等を unset している。
      # git はフック実行時に GIT_DIR / GIT_INDEX_FILE / GIT_WORK_TREE を設定するが、
      # flutter は内部で git を呼んで SDK バージョンを判定するため、これらが
      # 設定されているとリポジトリ側を見てしまい `0.0.0-unknown` と誤認する。
      # 結果 `pub get` が解決不能になり、git worktree からのコミットが常に失敗する。
      # （通常のリポジトリでは顕在化しないが、worktree では必ず起きる）
      - id: flutter-analyze
        name: Flutter Analyze
        entry: bash -c 'unset GIT_DIR GIT_INDEX_FILE GIT_WORK_TREE; cd frontend/kotonoha_app && flutter analyze --no-fatal-infos'
        language: system
        files: ^frontend/kotonoha_app/.*\.dart$
        pass_filenames: false
      - id: dart-format
        name: Dart Format Check
        entry: bash -c 'unset GIT_DIR GIT_INDEX_FILE GIT_WORK_TREE; cd frontend/kotonoha_app && dart format --set-exit-if-changed .'
        language: system
        files: ^frontend/kotonoha_app/.*\.dart$
        pass_filenames: false
